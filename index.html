<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy-Paste Helper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>📋 Copy-Paste Helper</h2>
        
        <textarea id="textBox" placeholder="Type here or paste text..."></textarea>
        
        <div class="btn-group">
            <button id="copyBtn">Copy Text</button>
            <button id="pasteBtn">Paste Text</button>
        </div>

        <p id="statusMsg" class="status-msg">Action Complete!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
